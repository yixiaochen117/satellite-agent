[project]
name = "cropcls"
version = "0.1.0"
description = "Small-model crop classification on Sentinel-2 imagery (TorchGeo + Lightning)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "torch>=2.7",
  "torchvision>=0.22",
  "torchgeo>=0.7",
  "lightning>=2.4",
  "timm>=1.0",
  "torchmetrics>=1.4",
  "rasterio>=1.3",
  "matplotlib>=3.8",
  "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cropcls"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
